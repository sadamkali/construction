name: Update Builders footer

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-footer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Update footer information
        run: |
          python - <<'PY'
          from pathlib import Path

          for path in Path('.').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              original = text

              # Keep the site location consistently as Uganda.
              text = text.replace('Kampala, Uganda', 'Uganda')

              # Use the requested designer credit and remove the template credit.
              text = text.replace(
                  'Designed by Saddam <span aria-hidden="true">|</span> <a href="https://htmlcodex.com">Template by HTML Codex</a>',
                  'Designed by Sadam'
              )
              text = text.replace('Designed by Saddam', 'Designed by Sadam')

              if text != original:
                  path.write_text(text, encoding='utf-8')
                  print(f'Updated {path}')
          PY

      - name: Commit changes and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          git rm .github/workflows/update-footer.yml
          git commit -m "update: set Uganda location and footer designer"
          git push
